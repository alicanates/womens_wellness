name: Build Android APK

on:
  push:
    branches:
      - main
      - chatbot
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📱 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: apps/mobile
        run: |
          # Use npm for standalone build
          npm install --legacy-peer-deps
          
      - name: 🔍 Verify Expo installation
        working-directory: apps/mobile
        run: |
          npx expo --version
          echo "Checking for expo-modules-core..."
          ls -la node_modules/expo-modules-core 2>/dev/null || echo "expo-modules-core not found in node_modules"

      - name: 🏗️ Generate Android native code
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean
          
      - name: 🔧 Make gradlew executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: 🔨 Build Android APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --stacktrace --info

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📊 Build Summary
        run: |
          echo "### ✅ Android APK Build Successful! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Location:** \`apps/mobile/android/app/build/outputs/apk/release/app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download:** Check the Artifacts section above" >> $GITHUB_STEP_SUMMARY
