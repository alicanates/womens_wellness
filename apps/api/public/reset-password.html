<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama - Women's Wellness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #FF69B4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .emoji {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #FF69B4;
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #525252;
            font-size: 16px;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #525252;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #FFD4E7;
            border-radius: 16px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #FF69B4;
        }

        .requirements {
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 6px;
        }

        button {
            width: 100%;
            background: #FF69B4;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.3);
        }

        button:hover {
            background: #E91E63;
        }

        button:disabled {
            background: #FFB6D9;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .message {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #6EE7B7;
        }

        .message.error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .message.show {
            display: block;
        }

        .spinner {
            border: 3px solid #FFD4E7;
            border-top: 3px solid #FF69B4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading.show {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔐</div>
        <h1>Yeni Şifre Belirle</h1>
        <p class="subtitle">Hesabın için yeni bir şifre oluştur</p>

        <div id="message" class="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">Yeni Şifre</label>
                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    required
                    minlength="8"
                    placeholder="En az 8 karakter"
                >
                <div class="requirements">En az 8 karakter olmalıdır</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    minlength="8"
                    placeholder="Şifreyi tekrar girin"
                >
            </div>

            <button type="submit" id="submitBtn">
                <span id="buttonText">Şifreyi Sıfırla</span>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span>Sıfırlanıyor...</span>
                </div>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const buttonText = document.getElementById('buttonText');
        const loading = document.getElementById('loading');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showMessage('error', 'Geçersiz şifre sıfırlama bağlantısı');
            submitBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showMessage('error', 'Şifreler eşleşmiyor');
                return;
            }

            // Validate password length
            if (newPassword.length < 8) {
                showMessage('error', 'Şifre en az 8 karakter olmalıdır');
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            buttonText.style.display = 'none';
            loading.classList.add('show');
            messageDiv.classList.remove('show');

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('success', '✓ ' + data.message);
                    form.reset();

                    // Redirect to success page or show instructions
                    setTimeout(() => {
                        showMessage('success', 'Yeni şifrenle giriş yapmak için mobil uygulamayı açabilirsin! 📱');
                    }, 2000);
                } else {
                    showMessage('error', data.message || 'Bir hata oluştu');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                showMessage('error', 'Bağlantı hatası. Lütfen tekrar deneyin.');
                submitBtn.disabled = false;
            } finally {
                buttonText.style.display = 'inline';
                loading.classList.remove('show');
            }
        });

        function showMessage(type, text) {
            messageDiv.className = `message ${type} show`;
            messageDiv.textContent = text;
        }
    </script>
</body>
</html>
